# One-time provisioning (DESIGN §10.1 step 2):
#   zcli project project-import zerops-project-import.yml --org-id <ORG_ID>
# (or paste into the Zerops GUI → Import). Secrets are never committed: the first import (2026-09-24) added an
# `envSecrets:` block to `app` in a throw-away copy generated from .env and deleted right after (docs/notes/deploy.md).
# Later secret changes: GUI → project baton → service app → Environment variables → Secret variables (reload, no rebuild).
project:
  name: baton
  description: "Baton: reps diagnose, AI finishes the call (AssemblyAI hackathon)"
  corePackage: LIGHT
  tags: [hackathon, assemblyai]
services:
  - hostname: app
    type: nodejs@22
    enableSubdomainAccess: true
    minContainers: 1          # always on: no cold starts during judging (Zerops runtimes never scale to zero)
    maxContainers: 1          # single container: the in-process ticker is fine; DB leases keep it safe anyway
    verticalAutoscaling: { cpuMode: SHARED, minCpu: 1, maxCpu: 2, minRam: 1, maxRam: 2, minDisk: 2, maxDisk: 6 }
  - hostname: db
    type: postgresql:single@17   # single = non-HA, the cheapest mode; fixed at creation; enough for the demo
