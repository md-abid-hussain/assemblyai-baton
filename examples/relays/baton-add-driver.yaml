        - kind: builtin
          id: insurance.monthly_premium
  - id: due_today
    label: Due today
    type: money
    ref:
      kind: builtin
      id: insurance.due_today_prorated
listening:
  keyterms:
    - learner's permit
    - probationary license
    - endorsement
    - garaging
    - premium
    - liability limits
    - good student discount
    - driver's ed
  contextKeyterms:
    - customer.firstName
    - customer.lastName
    - customer.fullName
    - table.existing_drivers.name
    - org.name
    - fact.carrier
    - org.repFirstName
    - table.vehicles.make
    - table.vehicles.model
    - table.vehicles.make_model
    - fact.address_street
    - fact.address_city
  languageCodes:
    - en
  scenarioPrompt: "Recorded phone call at a US insurance agency. A customer service representative and a policyholder discuss adding a driver to a personal auto policy: people's names, relationship, age or date of birth, learner's permit or driver's license, vehicle year make and model, ZIP codes, effective dates, and monthly premiums in dollars."
  tuning: telephony_8k
handoff:
  allowedWhen:
    minCallSeconds: 20
    requireVerified: []
  repLine: OK if my assistant finishes the paperwork? I'll be one tap away if you need me.
  repLinePatterns:
    - \b(finish|finishes|wrap|wraps) (up )?the paperwork\b
    - \b(one tap away|stay on the line)\b
  acceptance:
    phrase: Sure, go ahead.
    patterns:
      - \b(sure|ok|okay|yes|yeah|go ahead|that's fine|fine)\b
  autoBaton: true
  repReturnLine: I'm bringing your agent back on the line now.
playbook:
  voice: alba
  persona:
    tone: Warm, brief and plain-spoken US English.
    extraRules: []
  subject: "{?f.driver_full_name.verified}{f.driver_full_name|first_name}{:}the new driver{/?}"
  greeting:
    opening: Hi {customer.firstName}, I'm {rep.firstName}'s AI assistant, not a person. This call is recorded.
    summary: I'll finish adding {?f.driver_full_name.verified}{f.driver_full_name|first_name}{:}a new driver{/?}{clause.vehicle}{clause.date}{clause.premium}.
    clauses:
      - id: date
        text: "{?f.effective_date.verified}, starting {f.effective_date|spoken_date}{/?}"
        dropOrder: 0
      - id: vehicle
        text: "{?f.vehicle_assignment.verified}{?f.vehicle_assignment=all} to all your vehicles{:} to the {f.vehicle_assignment|lookup_label}{/?}{/?}"
        dropOrder: 1
      - id: premium
        text: "{?f.premium_new_monthly_usd.rep}, at {f.premium_new_monthly_usd|spoken_monthly}{/?}"
        dropOrder: 2
    optOut: Ask for {rep.firstName} anytime.
    next:
      confirm: Just to confirm, {phrase.confirm}?
      ask: I just need {phrase.ask}.
      ready: Ready for the updated premium?
    maxWords: 40
  promptTemplate: |-
    IDENTITY
    You are {org.name}'s automated AI assistant finishing a policy change that a licensed representative, {rep.firstName},
    started with the customer, {customer.firstName} {customer.lastName}. You already said the greeting. You are not a person; if asked, say so.
    TODAY is {call.date|spoken_date_long} (the date of this call). Resolve relative dates against TODAY.
    You handle ADMINISTRATIVE steps only. You never give insurance advice, never recommend coverages, limits or deductibles,
    and never explain what is or isn't covered. If the customer asks for advice or anything outside this change, call
    hand_back_to_rep with reason "advice_requested" (or "out_of_scope").

    CASE STATE (authoritative; VERIFIED = already confirmed with the customer)
    {case.json}

    RULES
    1. Never ask for a VERIFIED field, and never ask the customer to repeat it.
    2. Confirm PENDING fields one at a time by reading the value back. If the customer confirms or corrects it, call update_case_field.
    3. Ask for MISSING fields one at a time; when answered, call update_case_field.
    4. If the customer disputes a VERIFIED value, call update_case_field with their value and reason "customer_corrected";
       if the result is "conflict", read back the recorded value, ask which is right, and call update_case_field again with
       reason "customer_corrected" only if they insist. Never silently change a VERIFIED value.
    5. State a premium, amount or date ONLY if it comes from CASE STATE or a tool result. Never estimate or compute money.
    6. When a tool returns disclosure text, read it EXACTLY as written, word for word, then stop and wait for the answer.
    7. Never ask for, repeat, or accept card numbers, bank details or passwords. Payment happens only through the secure link.
       If the customer starts reading a card number, stop them politely and explain the link.
    8. One question per turn. Short sentences. Natural US English. Say ZIP codes digit by digit.
    9. If the customer asks for {rep.firstName}, or is upset or confused twice, call hand_back_to_rep.
    10. Discounts, coverage limits, deductibles and underwriting are {rep.firstName}'s decisions. Never offer, re-offer or
        change them; if the customer brings them up, say {rep.firstName} will follow up, or call hand_back_to_rep.

    CURRENT STAGE: {stage}
    {stage.goal}
  caseJson:
    header:
      - key: policy
        from: fact.policy_number
    tables:
      - key: vehicles
        table: vehicles
    maxChars: 1800
  vaKeyterms:
    - f.driver_full_name
    - f.driver_relation
    - table.vehicles.make_model
    - table.vehicles.model
    - customer.fullName
    - org.name
    - org.repFirstName
  stages:
    - id: confirm
      kind: confirm
      label: Confirm
      goal: Resolve every PENDING and MISSING required field, using confirm_effective_date for the date and update_case_field for everything else. When all required fields are VERIFIED, the system gives you the next step.
      tools:
        - confirm_effective_date
        - update_case_field
        - hand_back_to_rep
      exit:
        kind: all_required_verified
    - id: disclose
      kind: disclose
      label: Disclose
      goal: Call get_disclosure with kind "premium_change" and read it exactly. If the customer agrees, call get_disclosure with kind "esign_consent" and read it exactly. If they decline the premium, call hand_back_to_rep with reason "customer_declined".
      tools:
        - get_disclosure
        - confirm_effective_date
        - update_case_field
        - hand_back_to_rep
      exit:
        kind: disclosure_accepted
        disclosure: esign_consent
    - id: pay
      kind: act
      label: Pay
      goal: The customer agreed to the e-signature and text. Call send_esign_and_pay_link now with their words. When it returns, tell the customer in one short sentence that you texted the secure link and will wait while they sign and pay. Then stay quiet unless asked; the system gives status updates.
      tools:
        - send_esign_and_pay_link
        - get_disclosure
        - update_case_field
        - hand_back_to_rep
      exit:
        kind: connector_succeeded
        connector: esign_pay
    - id: close
      kind: close
      label: Close
      goal: Payment is confirmed. Call send_confirmation, read the confirmation number digit by digit, ask if there is anything else about this change, then say goodbye.
      tools:
        - send_confirmation
        - update_case_field
        - hand_back_to_rep
      exit:
        kind: end
  disclosures:
    - id: premium_change
      title: Premium change
      text: Here's the change. We're adding {?f.driver_full_name.known}{f.driver_full_name|first_name}{:}the new driver{/?} as a {?f.license_status.known}{f.license_status|insurance.license_adjective} {/?}driver{?f.vehicle_assignment.known}{?f.vehicle_assignment=all} on all your vehicles{:} on the {f.vehicle_assignment|lookup_label}{/?}{/?}{?f.effective_date.known}, starting {f.effective_date|spoken_date}{/?}. Your new premium is {v.monthly_premium|spoken_money} a month, and {v.due_today|spoken_money}{?opt.tax_suffix} plus any applicable tax{/?} is due today, prorated for the rest of this billing period. The change is subject to the terms of your policy. Would you like me to go ahead?
      criticalTokens:
        - "{v.monthly_premium|spoken_money}"
        - "{v.due_today|spoken_money}"
        - "{?f.effective_date.known}{f.effective_date|spoken_date}{/?}"
        - "{?f.driver_full_name.known}{f.driver_full_name|first_name}{:}the new driver{/?}"
        - "{?opt.tax_suffix}plus any applicable tax{/?}"
      requiresReady: true
      requiresAccepted: null
      consent: false
    - id: esign_consent
      title: E-sign consent
      text: I'll text a secure link to the number on file ending in {customer.phoneLast4|spoken_chars}, so you can review and sign this change electronically and pay the {v.due_today|spoken_money}. You can ask for a paper copy instead, and you can withdraw consent to electronic documents at any time. Is it OK if I text you that link now?
      criticalTokens:
        - "{customer.phoneLast4|spoken_chars}"
        - electronically
        - paper copy
      requiresReady: true
      requiresAccepted: premium_change
      consent: true
  builtinToolText:
    updateCaseFieldValueHint: As spoken; date of birth as YYYY-MM-DD; state as 2 letters; ZIP as 5 digits; vehicle as year make model
  sessionCap:
    baseSec: 150
    perFieldSec: 15
    maxSec: 420
connectors:
  - type: payment_link
    id: esign_pay
    label: E-sign and pay link
    toolName: send_esign_and_pay_link
    description: Text the customer a secure link to e-sign the change and pay the amount due today. Only after the customer agreed to the premium and to receiving the text. Returns right after the text is sent; the system tells you when the payment finishes.
    provider: polar_sandbox
    amount: due_today
    esign: true
    smsTemplate: "{org.name}: review and e-sign your policy change, then pay {v.due_today|spoken_money} here."
    requiresDisclosure: esign_consent
  - type: confirmation
    id: confirmation
    label: Confirmation
    toolName: send_confirmation
    description: Finalize the change and text a confirmation. Only after payment is confirmed.
    requires:
      - esign_pay
    smsTemplate: "{org.name}: your policy change is confirmed. Thank you, {customer.firstName}."
qa:
  reaskTargets: []
  verbatimThreshold: 0.9
  adviceLexicon:
    - \b(recommend\w*|suggest\w*|you (should|might want to)|limits?|deductibles?|coverages?|discounts?)\b
extraction:
  domainLine: an insurance policy-change case
  intentLine: add a driver to a personal auto policy
  fieldGuide: |-
    - driver_full_name: the new driver's name as spoken ("Maya", "Maya Raman").
    - driver_dob: YYYY-MM-DD.            - driver_age: integer years ("17").
    - driver_relation: one of spouse, domestic_partner, child, stepchild, parent, sibling, other_relative,
      non_relative_resident, non_relative_nonresident.
    - license_state: 2-letter US state code ("OH").   - license_number: as spoken, digits/letters only.
    - license_status: one of learner_permit, provisional (probationary), full.
    - incidents_3y: "none", or a short description of tickets/accidents/claims in the last 3 years.
    - vehicle_assignment: the policy vehicle the new driver will mainly drive, as its id from POLICY VEHICLES ("veh1").
    - operator_type: primary or occasional (for that vehicle).
    - garaging_zip: 5-digit ZIP where that vehicle is kept overnight.
    - effective_date: YYYY-MM-DD. Resolve relative dates ("tomorrow", "next Friday") against CALL DATE.
    - good_student_discount, driver_training_discount, distant_student_discount, mature_driver_discount:
      eligible, not_eligible or pending_proof.
    - coverage_change: short text of what the customer decided about coverage ("keep current limits").
    - underwriting_review: "true" or "false".
    - premium_new_monthly_usd, premium_change_monthly_usd, amount_due_today_usd: dollars with cents ("142.00", "-12.50").
      Only the REP can state these.
  contextKey: policy
  context:
    - key: policyholder
      from: customer.fullName
    - key: vehicles
      from: table.vehicles
    - key: address_zip
      from: fact.address_zip
    - key: existing_drivers
      from: table.existing_drivers.name
compliance:
  aiDisclosurePatterns:
    - AI assistant
    - not a person
  recordingNoticePattern: recorded
  neverCollect:
    - card_number
    - bank_account
    - password
    - ssn
