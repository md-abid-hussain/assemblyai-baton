meta:
  schema: changeover.blueprint/2.0
  slug: baton-add-driver
  title: Baton · add a driver
  tagline: A licensed rep hands a live call to an AI that finishes the add-a-driver paperwork.
  industry: insurance
  locale: en-US
  intent:
    id: add_driver
    summary: add a driver to a personal auto policy
    caseNoun: insurance policy-change case
  roles:
    rep: licensed representative
    customer: policyholder
    org: agency
  origin: seed
  sampleOnly: true
