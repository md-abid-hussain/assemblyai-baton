fields:
  - id: driver_full_name
    label: New driver's full name
    description: The new driver's name as spoken.
    type: person_name
    normalizer: person_name
    required: true
    setBy: ai_allowed
    adviceDomain: false
    promptVisibility: always
    validation: {}
    examples:
      - Maya Raman
    compare: token_subset
    display: title
    capture:
      priority: 1
      mode: balanced
      entity: true
    phrases:
      ask: the new driver's full name
      confirm: the new driver's name is {f.driver_full_name|title}
    qa:
      ask:
        - \b(full name|last name|first name|(her|his|their|the driver'?s|the new driver'?s) name|spell)\b
      weak:
        - \bname\b
    ui:
      group: Driver
      hidden: false
  - id: driver_dob
    label: Date of birth
    description: The new driver's date of birth.
    type: date
    normalizer: date_of_birth
    required: true
    setBy: ai_allowed
    adviceDomain: false
    promptVisibility: always
    validation: {}
    examples:
      - 2009-03-14
    compare: exact
    display: spoken_dob
    capture:
      priority: 3
      mode: balanced
      entity: true
    phrases:
      ask: "{subject}'s date of birth"
      confirm: "{subject}'s date of birth is {f.driver_dob|spoken_dob}"
    qa:
      ask:
        - \b(date of birth|birth ?date|birthday|born|how old|age|dob)\b
      weak: []
    ui:
      group: Driver
      hidden: false
  - id: driver_age
    label: Age
    description: The new driver's age in years.
    type: integer
    normalizer: insurance.age
    required: false
    setBy: rep_or_customer
    adviceDomain: false
    promptVisibility: when_known
    validation: {}
    examples:
      - "17"
    compare: exact
    display: raw
    capture:
      priority: 0
      mode: balanced
      entity: false
    phrases:
      ask: the age
      confirm: "{subject} is {f.driver_age}"
    qa:
      ask: []
      weak: []
    ui:
      group: Driver
      hidden: false
  - id: driver_relation
    label: Relationship to policyholder
    description: How the new driver is related to the policyholder.
    type: enum
    normalizer: insurance.relation
    enumValues:
      - value: spouse
        label: Spouse
        synonyms: []
        spokenForms:
          - wife
          - husband
          - spouse
      - value: domestic_partner
        label: Domestic partner
        synonyms: []
        spokenForms:
          - partner
      - value: child
        label: Child
        synonyms: []
        spokenForms:
          - daughter
          - son
          - child
          - kid
      - value: stepchild
        label: Stepchild
        synonyms: []
        spokenForms:
          - stepdaughter
          - stepson
          - stepchild
      - value: parent
        label: Parent
        synonyms: []
        spokenForms:
          - mother
          - father
          - mom
          - dad
          - parent
      - value: sibling
        label: Sibling
        synonyms: []
        spokenForms:
          - brother
          - sister
          - sibling
      - value: other_relative
        label: Other relative
        synonyms: []
        spokenForms:
          - niece
          - nephew
          - cousin
          - grandchild
          - granddaughter
          - grandson
          - relative
      - value: non_relative_resident
        label: Not related, lives with you
        synonyms: []
        spokenForms:
          - roommate
          - housemate
          - lives with you
        confirm: "{subject} is not related to you but lives with you"
        confirmIfRaw:
          - pattern: \b(roommate|boyfriend|girlfriend|room mate)\b
            text: "{subject} is your {f.driver_relation|insurance.relation_word}"
      - value: non_relative_nonresident
        label: Not related, lives elsewhere
        synonyms: []
        spokenForms:
          - doesn't live with you
          - not related
        confirm: "{subject} is not related to you and doesn't live with you"
    required: true
    setBy: ai_allowed
    adviceDomain: false
    promptVisibility: always
    validation: {}
    examples:
      - my daughter
    compare: exact
    display: insurance.relation_display
    capture:
      priority: 2
      mode: balanced
      entity: true
    phrases:
      ask: how {subject} is related to you
      confirm: "{subject} is your {f.driver_relation|insurance.relation_word}"
    qa:
      ask:
        - \b(relat\w*|your (daughter|son|wife|husband|partner|child|kid)|how do you know)\b
      weak: []
    ui:
      group: Driver
      hidden: false
  - id: license_state
    label: License state
    description: The state that issued the new driver's license.
    type: state
    normalizer: us_state
    required: true
    setBy: ai_allowed
    adviceDomain: false
    promptVisibility: always
    validation: {}
    examples:
      - OH
    compare: exact
    display: state_with_code
    capture:
      priority: 4
      mode: balanced
      entity: true
    phrases:
      ask: which state issued {subject}'s license
      confirm: "{subject}'s license is from {f.license_state|state_name}"
    qa:
      ask:
        - \b(which state|what state|state (issued|is (it|the license|her license|his license) from)|issued (it|her|his|the)|licensed in)\b
      weak: []
    ui:
      group: License
      hidden: false
  - id: license_status
    label: License type
    description: Learner's permit, probationary (provisional) or full license.
    type: enum
    normalizer: insurance.license_status
    enumValues:
      - value: learner_permit
        label: Learner's permit
        synonyms: []
        word: learner's permit
        spokenForms:
          - learner
          - permit
      - value: provisional
        label: Probationary license
        synonyms: []
        word: probationary license
        spokenForms:
          - probationary
          - provisional
          - junior
          - intermediate
          - graduated
      - value: full
        label: Full license
        synonyms: []
        word: full license
        spokenForms:
          - full license
          - fully licensed
    required: true
    setBy: ai_allowed
    adviceDomain: false
    promptVisibility: always
    validation: {}
    examples:
      - probationary license
    compare: exact
    display: insurance.license_words
    capture:
      priority: 5
      mode: balanced
      entity: true
    phrases:
      ask: whether {subject} has a permit, a probationary license or a full license
      confirm: "{subject} has a {f.license_status|insurance.license_words}"
    qa:
      ask:
        - \b(permit|probationary|provisional|learner'?s|(kind|type|sort) of licen[cs]e|full licen[cs]e|licen[cs]e (type|status|class))\b
      weak:
        - \blicen[cs]e[ds]?\b
    ui:
      group: License
      hidden: false
  - id: license_number
    label: License number
    description: The driver's license number, digits and letters only.
    type: id_code
    normalizer: id_code
    required: false
    setBy: ai_allowed
    adviceDomain: false
    promptVisibility: when_known
    validation: {}
    examples:
      - RM123456
    compare: exact
    display: spoken_chars
    capture:
      priority: 0
      mode: max_accuracy
      entity: false
    phrases:
      ask: "{subject}'s license number"
      confirm: "{subject}'s license number is {f.license_number|spoken_chars}"
    qa:
      ask:
        - \blicen[cs]e (number|no\.?|#)\b
        - \bdriver'?s licen[cs]e number\b
      weak: []
    ui:
      group: License
      hidden: false
  - id: incidents_3y
    label: Tickets / accidents (3 yrs)
    description: '"none", or a short description of tickets, accidents or claims in the last 3 years.'
    type: text
    normalizer: insurance.incidents
    required: false
    setBy: ai_allowed
    adviceDomain: false
    promptVisibility: when_known
    validation: {}
    examples:
      - none
    compare: exact
    display: insurance.incidents_display
    capture:
      priority: 6
      mode: balanced
      entity: true
    phrases:
      ask: whether {subject} has had any tickets or accidents in the last three years
      confirm: "{?f.incidents_3y=none}{subject} has had no tickets or accidents in the last three years{:}{subject} had {f.incidents_3y} in the last three years{/?}"
    qa:
      ask:
        - \b(tickets?|accidents?|violations?|claims?|driving record|citations?|moving violations?)\b
      weak: []
    ui:
      group: Driver
      hidden: false
  - id: vehicle_assignment
    label: Vehicle they'll drive
    description: The policy vehicle the new driver will mainly drive.
    type: lookup
    normalizer: insurance.vehicle
    lookup:
      table: vehicles
      matchColumns:
        - model
        - label
        - make_model
      allowAll: true
    required: true
    setBy: ai_allowed
    adviceDomain: false
    promptVisibility: always
    validation: {}
    examples:
      - the Civic
    compare: exact
    display: lookup_label
    capture:
      priority: 7
      mode: balanced
      entity: true
    phrases:
      ask: which car {subject} will mainly drive
      confirm: "{?f.vehicle_assignment=all}{subject} will drive all your vehicles{:}{subject} will mainly drive the {f.vehicle_assignment|lookup_label}{/?}"
    qa:
      ask:
        - \b(which (car|vehicle|one)|what (car|vehicle)|drive (mainly|mostly|primarily)|(mainly|mostly|primarily) drive|be driving)\b
      weak:
        - \b(vehicle|car)\b
    ui:
      group: Vehicle
      hidden: false
  - id: operator_type
    label: Primary or occasional driver
    description: Primary or occasional driver of that vehicle.
    type: enum
    normalizer: enum
    enumValues:
      - value: occasional
        label: Occasional
        synonyms:
          - \b(occasional|occasionally|sometimes|weekends?|once in a while|now and then|rarely|here and there|every now|not often|part[- ]time)\b
        spokenForms:
          - occasional
          - occasionally
          - sometimes
      - value: primary
        label: Primary
        synonyms:
          - \b(primary|primarily|every ?day|daily|mainly|mostly|main driver|principal|all the time|basically (his|hers|theirs)|(his|her|their) car|full[- ]time)\b
        spokenForms:
          - primary
          - every day
          - main driver
          - mainly
    required: true
    setBy: ai_allowed
    adviceDomain: false
    promptVisibility: always
    validation: {}
    examples:
      - primary
    compare: exact
    display: raw
    capture:
      priority: 8
      mode: balanced
      entity: true
    phrases:
      ask: whether {subject} will drive the {?f.vehicle_assignment.verified}{f.vehicle_assignment|lookup_label}{:}car{/?} daily or just occasionally
      confirm: "{subject} will be the {f.operator_type} driver of the {?f.vehicle_assignment.verified}{f.vehicle_assignment|lookup_label}{:}car{/?}"
    qa:
      ask:
        - \b(every ?day|primary|main driver|occasional\w*|how often)\b
      weak: []
    ui:
      group: Vehicle
      hidden: false
  - id: garaging_zip
    label: Garaging ZIP (where the car is kept)
    description: 5-digit ZIP where that vehicle is kept overnight.
    type: zip
    normalizer: us_zip5
    required: true
    setBy: ai_allowed
    adviceDomain: false
    promptVisibility: always
    validation: {}
    examples:
      - "44107"
    compare: exact
    display: raw
    capture:
      priority: 9
      mode: balanced
      entity: true
    phrases:
      ask: the ZIP code where the car is kept overnight
      confirm: the car is kept at ZIP code {f.garaging_zip|spoken_zip}
    qa:
      ask:
        - \b(zip|postal|kept overnight|parked|garag\w*)\b
      weak: []
    ui:
      group: Vehicle
      hidden: false
  - id: effective_date
    label: Effective date
    description: The date the change takes effect.
    type: date
    normalizer: date_future
    required: true
    setBy: rep_or_customer
    adviceDomain: false
    promptVisibility: always
    validation:
      minDaysFromCall: 0
      maxDaysFromCall: 90
    examples:
      - 2026-10-02
    compare: exact
    display: spoken_date
    capture:
      priority: 10
      mode: balanced
      entity: true
    phrases:
      ask: the date you'd like this change to start
      confirm: the change should start {f.effective_date|spoken_date}
    qa:
      ask:
        - \b(effective|start|begin|what date|which day|when would|when should|when do you want)\b
      weak: []
    confirmTool:
      name: confirm_effective_date
      description: Record the date the customer confirmed or chose for this change to take effect. Call only after the customer says the date or clearly confirms it.
      windowDays: 30
    ui:
      group: Change
      hidden: false
